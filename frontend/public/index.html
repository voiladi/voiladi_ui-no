        <title>Voiladi</title>
        <!-- Instant boot splash: painted before any JavaScript loads (logo centred, thin spinner near the bottom), identical to the in-app splash so the handoff is seamless. React replaces #root's content on mount. -->
        <style>
            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            html.dark,
            html.dark body {
                background: #000000;
            }
            #vo-boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #ffffff;
            }
            html.dark #vo-boot {
                background: #000000;
            }
            #vo-boot img {
                width: 84px;
                height: 79px;
                -webkit-user-drag: none;
            }
            #vo-boot .vo-boot-spin {
                position: absolute;
                bottom: max(48px, env(safe-area-inset-bottom));
                width: 22px;
                height: 22px;
                color: #8e8e93;
                animation: vo-boot-spin 0.85s linear infinite;
            }
            @keyframes vo-boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script>
            try {
                if (localStorage.getItem("voiladi_theme") === "dark") document.documentElement.classList.add("dark");
            } catch (e) {}
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
