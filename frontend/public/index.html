<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
        <meta name="theme-color" content="#FFFFFF" />
        <meta name="description" content="Voiladi - A more human internet. Chat. Share. Explore. Be real." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
        <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="apple-mobile-web-app-title" content="Voiladi" />
        <meta property="og:title" content="Voiladi" />
        <meta property="og:description" content="A more human internet. Chat. Share. Explore. Be real. All in one place." />
        <meta property="og:image" content="/icon-512.png" />
        <link rel="preconnect" href="%REACT_APP_BACKEND_URL%" crossorigin />
        <link rel="dns-prefetch" href="%REACT_APP_BACKEND_URL%" />
        <link rel="preload" as="image" href="/logo-mark.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
        <title>Voiladi</title>
        <!-- Instant boot splash: painted before any JavaScript loads (logo centred, thin spinner near the bottom), identical to the in-app splash so the handoff is seamless. React replaces #root's content on mount. -->
        <style>
            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            html.dark,
            html.dark body {
                background: #000000;
            }
            #vo-boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #ffffff;
            }
            html.dark #vo-boot {
                background: #000000;
            }
            #vo-boot img {
                width: 84px;
                height: 79px;
                -webkit-user-drag: none;
            }
            #vo-boot .vo-boot-spin {
                position: absolute;
                bottom: max(48px, env(safe-area-inset-bottom));
                width: 22px;
                height: 22px;
                color: #8e8e93;
                animation: vo-boot-spin 0.85s linear infinite;
            }
            @keyframes vo-boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script>
            try {
                var m = localStorage.getItem("voiladi_theme");
                var dark = m === "dark" || (m !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.classList.add("dark");
            } catch (e) {}
            /* Android shell 1.7+: edge-to-edge - read the status / navigation bar sizes before first paint */
            try {
                if (window.VoiladiNative && typeof window.VoiladiNative.insets === "function") {
                    var ins = JSON.parse(window.VoiladiNative.insets());
                    var h = document.documentElement;
                    h.classList.add("vo-native-insets");
                    h.style.setProperty("--native-inset-top", (ins.top || 0) + "px");
                    h.style.setProperty("--native-inset-bottom", (ins.bottom || 0) + "px");
                }
            } catch (e) {}
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <script>
            setTimeout(function () {
                var b = document.getElementById("vo-boot");
                if (!b || !document.body.contains(b)) return;
                var d = document.createElement("div");
                d.setAttribute("data-testid", "boot-slow");
                d.style.cssText = "position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);text-align:center;font:15px/1.4 Inter,system-ui,sans-serif;color:#8a8a8e;padding:0 24px";
                d.innerHTML = 'Taking longer than usual. <button type="button" onclick="location.reload(true)" style="margin-left:6px;height:36px;padding:0 16px;border:0;border-radius:999px;background:#111;color:#fff;font:600 15px Inter,system-ui,sans-serif">Reload</button>';
                b.appendChild(d);
            }, 15000);
        </script>
        <div id="root">
            <div id="vo-boot" aria-busy="true" aria-label="Loading Voiladi">
                <img src="/logo-mark.png" alt="" />
                <svg class="vo-boot-spin" viewBox="0 0 22 22" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" stroke-opacity="0.18"></circle>
                    <circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="45.2 62.8"></circle>
                </svg>
            </div>
        </div>
    </body>
</html>
